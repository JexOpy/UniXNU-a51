]
findings = [
  "Phase-0 /proc/iomem and /sys/firmware/fdt on physical SM-A515F confirmed exact RAM banks: 0x80000000-0xBAAFFFFF, 0xC0000000-0xDFFFFFFF, 0xE1900000-0xFFFFFFFF, and 4 GiB high RAM 0x880000000-0x97FFFFFFF (with el2_earlymem at 0x97DE00000).",
  "Confirmed exact TZ holes 0xBAB00000-0xC0000000 (85 MiB) and 0xE0000000-0xE1900000 (25 MiB), plus live S-Boot linux,initrd-start=0x89000000 and sec_debug_next 0x91202000-0x91B88000.",
  "UniXNU devicetree.py rejects multi-bank /memory nodes; initial bring-up targets the clean 0x92000000-0xBAA00000 span before adopting 4 GiB high RAM.",
]
completion = [
  "All SM-A515F physical RAM banks and secure holes are verified from on-device /proc/iomem.",
  "DarwinBoot allocates the XNU owned memory window cleanly without touching reserved carveouts.",
]
limits = [
  "High 4 GiB DRAM (0x880000000+) is not yet adopted into XNU.",
]
next_action = [
  "Compile dts/a51.dts to DTB/ADT on CI and verify UEFI MemoryMapLib boots without MMU faults on SM-A515F.",
]
