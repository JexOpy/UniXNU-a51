schema_version = 1

[device]
name = "a51"
soc = "Exynos 9611"
os_profile = "ipados-17.7.11-21H461"
summary = "Samsung Galaxy A51 (SM-A515F, Exynos 9611 / S5E9611, 6 GB / 128 GB UFS, bootloader A515FXXU8HWI1): Phase-0 hardware inventory measured on-device; Format 2 scaffold and uefi-a51 ready for Stage-1 CI build."

[[area]]
id = "configuration"
status = "planned"
components = ["ArmDTPlatform", "SoftwareAES"]
paths = ["board.toml", "feeds.toml", "configs/**", "local.toml.example", ".gitmodules", ".github/**", ".gitignore"]
inputs = [
  "Samsung Exynos 9611 (S5E9611) shares exynos9610.dts register map (Exynos9611Development/android_kernel_samsung_universal9611 commit 23f87fb36310eee5e8ec5e27a3a0cd089209cbb4).",
  "Target OS profile ipados-17.7.11-21H461 (iPad7,1 arm64) selected because Cortex-A53/A73 are ARMv8.0-A without PAC/arm64e.",
  "SoC profile provided by UniXNU-exynos9611-common (pinned via feeds.toml; local path during initial development).",
]
configuration = [
  "board.toml: schema_version = 2, board.name = 'a51', board.soc = 'Exynos 9611', board.soc_source = 'exynos9611', board.os_profile = 'ipados-17.7.11-21H461'.",
  "configs/a51_defconfig sets CONFIG_XNU_NATIVE_PAN=n, CONFIG_XNU_ARM_DT_PLATFORM=y, CONFIG_XNU_ARMCPU=y, CONFIG_XNU_NATIVE_AES=y.",
  "config_fragments order: arch:configs/common.config -> soc:configs/exynos9611.config -> os:configs/ipados.config -> a51_defconfig.",
]
procedure = [
  "Run ./unixnu defconfig a51_defconfig -D ../UniXNU-a51 from the UniXNU checkout.",
  "Run ./unixnu fetch -D ../UniXNU-a51, ./unixnu status --json -D ../UniXNU-a51, and ./unixnu tree -D ../UniXNU-a51.",
  "Run python3 scripts/porting-record.py check --device ../UniXNU-a51.",
]
findings = [
  "Exynos 9611 uses ARMv8.0-A Cortex-A53 and Cortex-A73 cores; ARMv8.1 PAN must be disabled in configs/exynos9611.config and arm64e profiles (iOS/macOS 27) are unsupported.",
  "Samsung S-Boot does not expose fastboot; images must be flashed via Odin tar archives or TWRP block writes to boot or recovery.",
  "feeds.toml now pins https://github.com/JexOpy/UniXNU-exynos9611-common.git at commit e034227aa7aa1ee9b1a5182b91f8c49e4e72f3f7 (including sheng-platform-power.patch context hunk required by upstream ipados-17 zzz-boot-progress.patch), and GitHub Actions workflows default to JexOpy repositories.",
  "board.toml [kernel] archives explicitly lists component:RamBlock alongside the arm64 profile archives so unixnu tree validates all selected kernel components.",
  "package.yml passes an absolute UEFI checkout path via --uefi and UNIXNU_UEFI so patch-xnu-entry-probe.py locates FrameBufferSerialPortLib/Font.h for panic_screen.",
  "board.toml sets payload.panic_screen = true using uefi-a51 FrameBufferSerialPortLib/Font.h (GLYPH_FONT packed from Font5x16.h) so early XNU exceptions and panic backtraces render on-screen.",
  "board.toml [firmware] packages places {uefi}/Mu_Basecore before {edk2} (with Timer/Auth-Service/Usb-Bus patches applied in package.yml) so Sota4Ever/Mu-Silicium builds against its matched Mu_Basecore.",
  "package.yml exports UNIXNU_DTB pointing to the compiled hardware.dtb so unixnu bootimg packs SILICIUM_UEFI.fd (UNIXNU_PAYLOAD=1) and payload.img into boot.img.",
]
completion = [
  "All four configuration layers resolve cleanly in unixnu status --json with pinned Git commits in feeds.toml and unixnu.lock.",
  "Porting record workflow passes on GitHub Actions.",
]
limits = [
  "unixnu.lock has not been generated yet via unixnu fetch after remote repositories are pushed.",
]
next_action = [
  "Push UniXNU-exynos9611-common, uefi-a51, and UniXNU-a51 to JexOpy on GitHub and run uefi-bringup.yml.",
]
evidence = []

[[area]]
id = "firmware"
status = "planned"
components = ["DarwinBoot"]
paths = ["proprietary-files.txt", "package/.gitkeep"]
inputs = [
  "UEFI base repository uefi-a51 derived from Sota4Ever/Mu-Silicium (branch send, commit 832879febad7fa3893c9becdc113c35a97f15608), which reaches BDS on Galaxy A50 (S5E9610Pkg).",
  "SM-A515F hardware differences vs A50: 1080x2400 panel (s6e3fa9/ea8076), Exynos 9611, 6 GB RAM / 128 GB UFS, same gpio_keys pins (gpa1-5/6/7) and S2MPU09 PMIC.",
  "Samsung Galaxy A51 boot image geometry from LineageOS/TWRP BoardConfig.mk: base=0x10000000, pagesize=2048, boot=61865984 B, recovery=71106560 B.",
]
configuration = [
  "board.toml [firmware]: dsc = Platforms/Samsung/a51Pkg/a51.dsc, config = a51, FD 3 MiB at 0xC9000000, stack at 0xC9300000, ENABLE_SECUREBOOT=0, UNIXNU_PAYLOAD=1.",
  "board.toml [firmware] patches include Resources/MuPatches/Timer.patch (26 MHz CNTFRQ_EL0 fallback), Auth-Service.patch, and Usb-Bus.patch.",
  "uefi-a51 patches BootShim.S (FD_SIZE + (_Payload - _Head) + cache clean) and SiliciumPkg Sec (EntryArg HOB DAEE82E6-8090-4E72-BFB9-78C13CD4E359 for UniXNURamDiskDxe).",
]
procedure = [
  "Build standalone Stage-1 UEFI via GitHub Actions workflow uefi-bringup.yml (or ./unixnu build firmware --uefi ../uefi-a51).",
  "Pack output image into Odin recovery.tar using scripts/pack-odin-tar.py and boot recovery on unlocked SM-A515F.",
  "Confirm UEFI display output, volume/power keypad navigation, UFS block enumeration, and UniXNU boot menu entry discovery.",
]
findings = [
  "Sota4Ever/Mu-Silicium BootShim.S sets ARM64 Image Size to FD_SIZE alone and lacks cache cleaning before branching to FD_BASE; updated in uefi-a51 to match UniXNU bootimg.py checks.",
  "Sota4Ever/Mu-Silicium SiliciumPkg Sec does not publish S-Boot's x0 FDT pointer HOB; patched in uefi-a51 so UniXNURamDiskDxe can locate /chosen/linux,initrd-start/end.",
  "Phase-0 dump on SM-A515F (bootloader A515FXXU8HWI1) confirmed stock boot and recovery use Android header_version = 2 with a Samsung DT_TABLE (magic 0xd7b7ab1e) in --dtb (135,232 B) plus a 476,800 B --recovery_dtbo in recovery, and load initrd at physical 0x89000000.",
  "Resources/Configs/a51.toml sets header_version = 2 and dtb_location = 'outside' with Resources/DTBs/a51.dtb, while defining both base/size and fd_base/fd_size.",
]
completion = [
  "SILICIUM_UEFI.fd builds cleanly on CI and reaches the UniXNU menu on physical SM-A515F with working GOP display and keypad input.",
  "UniXNURamDiskDxe mounts the FAT payload volume and DarwinBoot loads kernel.macho and kernel.macho.adt.",
]
limits = [
  "uefi-a51 has not been compiled on CI or booted on physical SM-A515F hardware yet.",
]
next_action = [
  "Push UniXNU-exynos9611-common, UniXNU-a51, and uefi-a51 to GitHub, run uefi-bringup.yml, repack recovery with scripts/pack-sboot-v2.py using phase0 stock-recovery.img donor, and test booting recovery on SM-A515F.",
]
evidence = []

[[area]]
id = "cpu"
status = "planned"
components = ["ArmCpu"]
paths = ["dts/a51.dts"]
inputs = [
  "Exynos 9611 CPU topology from exynos9610.dts: cluster 0 = 4x Cortex-A53 (MPIDR 0x0..0x3), cluster 1 = 4x Cortex-A73 (MPIDR 0x100..0x103).",
  "Interrupt controller: ARM GIC-400 (GICv2) at GICD 0x12301000 (0x1000), GICC 0x12302000 (0x1000), GICH 0x12304000 (0x2000), GICV 0x12306000 (0x2000).",
  "ARMv8 generic timer at 26 MHz (PPIs 13/14/11/10); PSCI 0.2 via SMC (suspend=0xC4000001, off=0x84000002, on=0xC4000003).",
]
configuration = [
  "UniXNU-exynos9611-common/dts/exynos9611.dtsi defines cpu0 enabled and cpu1..cpu7 disabled for initial single-core bring-up.",
  "GIC node exports unixnu,adt-name = 'intc' and intentionally omits self-interrupts to avoid XNU IODTFindInterruptParent NULL dereference.",
  "CONFIG_XNU_NATIVE_PAN=n and CONFIG_XNU_ARMCPU=y.",
]
procedure = [
  "Verify single-core boot on cpu0 with GIC-400 interrupt initialization and 26 MHz timer ticks.",
  "After cpu0 reaches launchd or kernel shell checkpoint, enable cpu1..cpu7 in dts/a51.dts and verify PSCI CPU_ON and IPIs.",
]
findings = [
  "Upstream UniXNU/ArmCpu targets GICv3; Exynos 9611 uses GIC-400 (GICv2), matching the same GICv2 gap documented on Exynos 9825 (d1x), Exynos 8890 (hero2lte), and Exynos 7870 (gtaxllte).",
  "Samsung S-Boot does not program CNTFRQ_EL0; XNU and UEFI must rely on the 26 MHz DT/PCD rate.",
  "Added patches/armcpu-gicv2.patch (applied to UniXNU/drivers/ArmCpu in package.yml) implementing GIC-400 (GICv2) MMIO GICD/GICC support (mapGic, initDistributor, wakeRedistributor, enableGic, interrupt IAR/EOIR, signalCPU GICD_SGIR, quiesceCPU).",
  "Disabled CONFIG_XNU_BOOT_PROGRESS=n and removed serial=3 from kernel_args so XNU -v verbose console text renders directly to the 1080x2400 framebuffer during early bring-up.",
]
completion = [
  "Boot CPU (cpu0) handles timer IRQs and GIC-400 interrupts without panicking.",
  "All 8 cores (4x A53 + 4x A73) come online via PSCI SMC and deliver IPIs.",
]
limits = [
  "GICv2 (GIC-400) support for ArmCpu is not yet implemented for Exynos 9611.",
  "SMP (cpu1..cpu7) is disabled in DTS until single-core bring-up succeeds.",
]
next_action = [
  "Add GIC-400 (GICv2) support patch for ArmCpu in UniXNU-exynos9611-common/patches/xnu/ after UEFI menu bring-up succeeds.",
]
evidence = []

