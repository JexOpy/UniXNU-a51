  "Reserved memory regions from exynos9610-rmem.dtsi: abox (0xE9400000), modem_if (0xED000000), cp_ram_logging (0xF5A00000), chub (0xFD000000).",
]
configuration = [
  "dts/a51.dts exposes one contiguous 650 MiB low-RAM window 0x92000000..0xBAA00000 (above S-Boot initrd 0x89000000 and sec_debug_next 0x91202000..0x91B88000, below TZ hole 0xBAB00000).",
  "board.toml [payload.adt] owned_memory_size = '0x20000000' (512 MiB initial XNU owned window).",
  "uefi-a51 MemoryMapLib.c reserves Payload RAM disk (0x89000000, 72 MiB), SEC Debug Logs (0x91200000), TZ holes, UEFI Heap/FD/Stack, Display Reserved (0xCA000000, 20 MiB), Camera, ABOX, Modem, ESS, GNSS, and CHUB regions.",
]
procedure = [
