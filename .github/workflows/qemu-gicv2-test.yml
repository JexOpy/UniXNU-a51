name: QEMU GICv2 Kernel UART Test

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Package workflow run ID to pull kernel.macho from"
        required: false
        default: "44869276621"
      boot_args:
        description: "XNU boot-args"
        required: false
        default: "-v serial=3 debug=0x14e"
      timeout_sec:
        description: "QEMU timeout in seconds"
        required: false
        default: "30"

jobs:
  qemu-gicv2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout UniXNU-a51
        uses: actions/checkout@v4

      - name: Checkout UniXNU (for dt2adt.py + qemu-entry)
        uses: actions/checkout@v4
        with:
          repository: UniXNU/UniXNU
          ref: main
          path: UniXNU

      - name: Install QEMU, LLVM, dtc, mtools, gdb-multiarch
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-arm device-tree-compiler mtools clang lld llvm gdb-multiarch

      - name: Download built images artifact
        uses: actions/download-artifact@v4
        with:
          name: a51-unixnu-images-17
          run-id: ${{ github.event.inputs.run_id || '44869276621' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: /tmp/a51-images

      - name: Extract kernel.macho from payload.img
        run: |
          PAYLOAD=$(find /tmp/a51-images -name payload.img -type f | head -n 1)
          echo "Found payload: $PAYLOAD"
          mdir -/ -b -i "$PAYLOAD" ::/
          KPATH=$(mdir -/ -b -i "$PAYLOAD" ::/ | grep -i 'kernel\.macho$' | head -n 1)
          echo "Found kernel inside payload: $KPATH"
          mcopy -i "$PAYLOAD" "$KPATH" /tmp/kernel.macho
          ls -lh /tmp/kernel.macho
          file /tmp/kernel.macho
          python3 - << 'SYMEOF'
          import struct
          m = open("/tmp/kernel.macho", "rb").read()
          ncmds = struct.unpack_from("<I", m, 16)[0]
          off = 32
          syms = []
          for _ in range(ncmds):
              cmd, sz = struct.unpack_from("<II", m, off)
              if cmd == 2:
                  symoff, nsyms, stroff, strsize = struct.unpack_from("<IIII", m, off + 8)
                  for i in range(nsyms):
                      strx, stype, sect, desc, val = struct.unpack_from("<IBBHQ", m, symoff + i*16)
                      if (stype & 0xe0) == 0 and (stype & 0x0e) == 0x0e and val >= 0xfffffff007000000:
                          end = m.find(b"\x00", stroff + strx)
                          syms.append((val, m[stroff+strx:end].decode("ascii", "ignore")))
              off += sz
          syms.sort()
          for target in (0xfffffff00740fd3c, 0xfffffff007579b84):
              for i, (val, name) in enumerate(syms):
                  if val > target:
                      v0, n0 = syms[i-1]
                      print(f"RESOLVE {hex(target)} -> {n0} + {hex(target - v0)} (base {hex(v0)})")
                      break
          SYMEOF
          llvm-objdump -d --start-address=0xfffffff00740fd10 --stop-address=0xfffffff00740fd60 /tmp/kernel.macho || true

      - name: Build QEMU virt GICv2 ADT (arm,gic-400 + PL011)
        run: |
          python3 - << 'PYEOF'
          import os, struct, sys
          from pathlib import Path
          sys.path.insert(0, str(Path("UniXNU/scripts").resolve()))
          from unixnu.devicetree import node

          timebase = 62500000
          cpu0 = node('cpu0', [
              ('state', b'running\0'),
              ('reg', struct.pack('<I', 0)),
              ('device_type', b'cpu\0'),
              ('compatible', b'arm,cortex-a53\0'),
              ('timebase-frequency', struct.pack('<I', timebase)),
              ('clock-frequency', struct.pack('<I', 1000000000)),
          ])
          tree = node('device-tree', [
              ('model', b'qemu-gicv2-a51-test\0'),
              ('compatible', b'linux,dummy-virt\0'),
          ], [
              node('chosen', [
                  ('random-seed', os.urandom(256)),
                  ('dram-base', struct.pack('<Q', 0x40000000)),
                  ('dram-size', struct.pack('<Q', 0x20000000)),
              ], [
                  node('memory-map', []),
                  node('manifest-properties', []),
              ]),
              node('cpus', children=[cpu0]),
              node('defaults', [('vmm-present', struct.pack('<I', 1))]),
              node('product', [
                  ('product-name', b'QEMU virt GICv2\0'),
                  ('model', b'linux,dummy-virt\0'),
              ]),
              node('arm-io', [
                  ('device_type', b'qemu-virt\0'),
                  ('ranges', struct.pack('<QQQ', 0, 0x08000000, 0x04000000)),
              ], [
                  node('intc', [
                      ('compatible', b'arm,gic-400\0'),
                      ('reg', struct.pack('<4Q', 0, 0x10000, 0x10000, 0x10000)),
                  ]),
                  node('uart0', [
                      ('compatible', b'arm,pl011\0'),
                      ('reg', struct.pack('<2Q', 0x01000000, 0x1000)),
                  ]),
              ]),
          ])
          Path('/tmp/qemu-gicv2.adt').write_bytes(tree)
          print(f"Generated /tmp/qemu-gicv2.adt: {len(tree)} bytes")
          PYEOF

      - name: Prepare entry.bin + kernel-flat.bin + boot-args.bin and run QEMU GICv2
        run: |
          mkdir -p /tmp/qemu-out
          python3 - << 'PYEOF'
          import importlib.util, json, subprocess, sys
          from pathlib import Path

          spec = importlib.util.spec_from_file_location("probe", "UniXNU/scripts/probe-stock-entry.py")
          probe = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(probe)

          out = Path("/tmp/qemu-out")
          boot_args = "${{ github.event.inputs.boot_args || '-v serial=3 debug=0x14e' }}"
          # Match virtual_base mod 2MB (0x7c000) so XNU L2 block mappings align identically to DarwinBoot
          phys_base = 0x5007c000
          boot_args_pa = 0x55000000
          report = probe.prepare(
              Path("/tmp/kernel.macho"),
              out,
              phys_base=phys_base,
              boot_args_pa=boot_args_pa,
              device_tree=Path("/tmp/qemu-gicv2.adt"),
              command_line=boot_args,
          )
          print(json.dumps(report, indent=2))

          entry_pa = int(report["entry_pa"], 16)
          subprocess.run([
              "clang", "--target=aarch64-none-elf", "-c",
              f"-DBOOT_ARGS_PA={boot_args_pa}",
              f"-DKERNEL_ENTRY_PA={entry_pa}",
              "UniXNU/scripts/qemu-entry/entry.S", "-o", str(out / "entry.o")
          ], check=True)
          subprocess.run([
              "ld.lld", "-T", "UniXNU/scripts/qemu-entry/link.ld",
              str(out / "entry.o"), "-o", str(out / "entry.elf")
          ], check=True)
          subprocess.run([
              "llvm-objcopy", "-O", "binary",
              str(out / "entry.elf"), str(out / "entry.bin")
          ], check=True)
          PYEOF

          echo "========== RUNNING QEMU -cpu cortex-a53 WITH GDB STUB =========="
          rm -f /tmp/qemu-out/serial.log /tmp/qemu-out/stderr.log
          qemu-system-aarch64 \
            -M virt,gic-version=2,virtualization=off,secure=off \
            -accel tcg \
            -cpu cortex-a53 \
            -m 1024 \
            -smp 1 \
            -display none \
            -monitor none \
            -nic none \
            -no-reboot \
            -gdb tcp::1234 \
            -serial file:/tmp/qemu-out/serial.log \
            -kernel /tmp/qemu-out/entry.bin \
            -device loader,file=/tmp/qemu-out/kernel-flat.bin,addr=0x5007c000,force-raw=on \
            -device loader,file=/tmp/qemu-out/boot-args.bin,addr=0x55000000,force-raw=on \
            2>/tmp/qemu-out/stderr.log &
          QPID=$!
          sleep 15

          python3 - << 'GDBEOF'
          import struct, subprocess
          m = open("/tmp/kernel.macho", "rb").read()
          ncmds = struct.unpack_from("<I", m, 16)[0]
          off = 32
          syms = {}
          sym_list = []
          for _ in range(ncmds):
              cmd, sz = struct.unpack_from("<II", m, off)
              if cmd == 2:
                  symoff, nsyms, stroff, strsize = struct.unpack_from("<IIII", m, off + 8)
                  for i in range(nsyms):
                      strx, stype, sect, desc, val = struct.unpack_from("<IBBHQ", m, symoff + i*16)
                      if (stype & 0xe0) == 0 and (stype & 0x0e) == 0x0e and val >= 0xfffffff004000000:
                          end = m.find(b"\x00", stroff + strx)
                          name = m[stroff+strx:end].decode("ascii", "ignore")
                          syms[name] = val
                          sym_list.append((val, name))
              off += sz
          sym_list.sort()
          def resolve(addr):
              lo, hi = 0, len(sym_list) - 1
              best = None
              while lo <= hi:
                  mid = (lo + hi) // 2
                  if sym_list[mid][0] <= addr:
                      best = sym_list[mid]
                      lo = mid + 1
                  else:
                      hi = mid - 1
              return f"{best[1]}+{hex(addr - best[0])}" if best else hex(addr)

          for k in ("_debug_buf_base", "_debug_buf_ptr", "_msgbufp", "_panicstr", "_PE_state"):
              print(f"SYM {k} = {hex(syms[k]) if k in syms else 'NOT FOUND'}")

          cmds = [
              "set pagination off",
              "set architecture aarch64",
              "target remote 127.0.0.1:1234",
              "info reg pc lr sp x0 x1 x2 x3 x29",
              "x/4i $pc",
              "printf \"\\n=== PANIC SAVED STATE / STACK ===\\n\"",
              "x/40gx $x1",
              "printf \"\\n=== STACK ===\\n\"",
              "x/32gx $sp",
          ]
          if "_panicstr" in syms:
              cmds.append(f"printf \"\\n=== PANICSTR ===\\n\"")
              cmds.append(f"x/gx {hex(syms['_panicstr'])}")
              cmds.append(f"x/s *(unsigned long *){hex(syms['_panicstr'])}")
          if "_debug_buf_base" in syms:
              cmds.append(f"printf \"\\n=== DEBUG_BUF ===\\n\"")
              cmds.append(f"x/gx {hex(syms['_debug_buf_base'])}")
              cmds.append(f"x/10s *(unsigned long *){hex(syms['_debug_buf_base'])}")
          if "_msgbufp" in syms:
              cmds.append(f"printf \"\\n=== MSGBUF ===\\n\"")
              cmds.append(f"x/4gx *(unsigned long *){hex(syms['_msgbufp'])}")
              cmds.append(f"dump binary memory /tmp/qemu-out/dmesg.txt *(unsigned long *)(*(unsigned long *){hex(syms['_msgbufp'])} + 0x10) (*(unsigned long *)(*(unsigned long *){hex(syms['_msgbufp'])} + 0x10) + 0x4000)")
          cmds.append("detach")
          cmds.append("quit")

          args = ["gdb-multiarch", "-batch"]
          for c in cmds:
              args += ["-ex", c]
          res = subprocess.run(args, capture_output=True, text=True, timeout=20)
          print(res.stdout)
          if res.stderr:
              print("GDB STDERR:", res.stderr[:1000])
          import pathlib
          dp = pathlib.Path("/tmp/qemu-out/dmesg.txt")
          if dp.exists():
              txt = dp.read_bytes().split(b"\x00")[0].decode("utf-8", "replace")
              print("========== FULL XNU DMESG (MSGBUF) ==========")
              print(txt)
              print("========== END XNU DMESG ==========")
          GDBEOF

          kill "$QPID" 2>/dev/null || true
          echo "---------- PL011 UART SERIAL LOG ----------"
          cat /tmp/qemu-out/serial.log || true
          echo "---------- END SERIAL LOG ----------"

      - name: Upload QEMU serial log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qemu-gicv2-serial-log
          path: |
            /tmp/qemu-out/serial.log
            /tmp/qemu-out/qemu-stderr.log
